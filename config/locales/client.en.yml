        delete_old_label: "Also delete the previous user (%{username})"
        delete_old_only_if_no_posts: "Available only when the previous user has 0 posts and is not staff."
        confirm_force: "Move link & continue"
        cancel: "Cancel"

      user_card:
        post_count: "Posts"
