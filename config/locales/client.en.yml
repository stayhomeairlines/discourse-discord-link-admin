        email: "Email"
        trust_level: "Trust level"
        admin: "Admin"
        moderator: "Moderator"
        created_at: "Created"
        can_delete: "Can be deleted"
        cannot_delete: "Cannot be deleted (has posts or is staff)"
        yes: "yes"
        no: "no"
