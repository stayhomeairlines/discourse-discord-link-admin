  js:
    discord_link_admin:
      title: "Discord Account Link"
      description: "Manually link or unlink a Discord account on a Discourse user. Admins only."
      tab_link: "Link"
      tab_unlink: "Unlink"

      link:
        section_title: "Link a Discord account"
        section_help: "Use when a member's Discourse email differs from their Discord email so OAuth login can't auto-merge."
        username_label: "Discourse username"
        username_placeholder: "e.g. sasapiyo"
